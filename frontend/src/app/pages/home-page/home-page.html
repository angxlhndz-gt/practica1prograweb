<main class="home page-shell">
  <h1>Explorador de personajes</h1>
  <p>Selecciona un universo para consultar sus personajes.</p>

  <section class="universe-grid" aria-label="Universos disponibles">
    @for (universo of universos; track universo.id) {
      <a class="universe-link" [routerLink]="['/characters', universo.id]">
        <mat-card class="universe-card">
          <img [src]="universo.image" [alt]="'Personaje representativo de ' + universo.title" loading="lazy">
          <mat-card-content>
            <h2>{{ universo.title }}</h2>
            <p>{{ universo.description }}</p>
          </mat-card-content>
        </mat-card>
      </a>
    }
  </section>
</main>
